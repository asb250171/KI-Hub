<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Prozess-Cockpit</title>
<script>
  // Farbschema vor dem ersten Paint setzen (kein Aufblitzen des falschen Themes).
  (function(){ var t; try{ t=localStorage.getItem("cockpit-scheme"); }catch(e){}
    if(!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "porzellan" : "studio";
    document.documentElement.dataset.scheme = t; })();
</script>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
