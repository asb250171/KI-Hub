<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live-Prozesse · n8n</title>
<style>
  :root{--bg:#030918;--surface:#070E1B;--card:#101827;--border:#293344;--text:#EDF2F7;--dim:#98A3B5;--n8n:#00D9E8;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,"Cascadia Mono",monospace}
  #root{display:flex;flex-direction:column;gap:12px;height:100vh;height:100dvh;padding:14px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .spacer{margin-left:auto}
  h1{font-size:15px;font-weight:800;margin:0}
  .pill{font-size:12px;font-weight:700;border-radius:8px;padding:3px 10px}
  .btn{display:grid;place-items:center;height:32px;min-width:32px;padding:0 8px;border-radius:8px;background:var(--card);color:var(--dim);border:1px solid var(--border);cursor:pointer;font-size:12px}
  .btn:hover{color:var(--text)}
  .btn.active{background:rgba(0,217,232,.13);color:var(--n8n);border-color:rgba(0,217,232,.4)}
  select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
  .kpi b{font-size:16px}.kpi span{display:block;margin-top:2px;font-size:10px;color:var(--dim)}
  .notice{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--dim)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:10px;color:var(--dim)}
  .chip{display:inline-flex;align-items:center;gap:6px}
  .main{display:flex;gap:12px;flex:1;min-height:0}
  .canvas{position:relative;flex:1;min-width:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);
    background-image:linear-gradient(rgba(41,51,68,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(41,51,68,.16) 1px,transparent 1px);background-size:24px 24px;cursor:grab}
  .canvas.grabbing{cursor:grabbing}
  .stage{position:absolute;transform-origin:0 0}
  .panel{width:320px;flex:none;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
  @media(max-width:1000px){.panel{display:none}}
  .panel.hidden{display:none}
  .panel h2{margin:0;font-size:12px;font-weight:700;padding:12px 14px;border-bottom:1px solid var(--border)}
  .list{flex:1;overflow:auto;padding:8px}
  .item{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;color:var(--text)}
  .item small{display:block;color:var(--dim);font-size:10px}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:600}
  .zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .zoom button{width:32px;height:32px;background:var(--card);color:var(--dim);border:0;border-top:1px solid var(--border);cursor:pointer}
  .zoom button:first-child{border-top:0}
  .float{position:absolute;top:12px;right:12px;bottom:12px;width:320px;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);z-index:20}
  .center{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px;text-align:center;padding:20px}
  .flow{stroke-dasharray:2 7;animation:dash 1.1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-18}}
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  .dot{animation:mv 2.4s linear infinite}
  @keyframes mv{to{offset-distance:100%}}
  @media (prefers-reduced-motion: reduce){.flow{animation:none;stroke-dasharray:none}.dot{display:none}.pulse{animation:none;opacity:1}}
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
